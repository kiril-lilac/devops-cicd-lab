name: Build image and update manifest

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Kubernetes manifest
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu

          image_count=$(printf '%s\n' "$IMAGE" | sed '/^[[:space:]]*$/d' | wc -l)

          if [ "$image_count" -ne 1 ]; then
            echo "Expected exactly one image tag, got:"
            printf '%s\n' "$IMAGE"
            exit 1
          fi

          sed -i -E \
            "s|^[[:space:]]*image:.*$|          image: ${IMAGE}|" \
            k8s/deployment.yaml

          grep -n "image:" k8s/deployment.yaml

      - name: Commit and push manifest update
        run: |
          set -eu

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git commit -m "Update image to ${GITHUB_SHA::7} [skip ci]"
          git push
